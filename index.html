<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXUS Learning</title>
  <meta name="description" content="Mi cuaderno de estudio: cursos con lecciones, ejercicios y evaluaciones, con seguimiento de progreso.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/temas.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/cuaderno.css">
  <link rel="stylesheet" href="assets/css/practica.css">
</head>
<body data-tema="hoy">
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" type="button" aria-label="Abrir índice" hidden>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
    <a href="#/" class="brand" aria-label="NEXUS cuaderno, ir a Hoy">
      <span class="brand-nexus">nexus</span><span class="brand-cuaderno">cuaderno</span>
    </a>
    <span class="chip-curso" id="chipCurso" hidden></span>
    <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
  </header>

  <div class="escritorio" id="escritorio">
    <aside class="sidebar" id="sidebar" aria-label="Índice del curso" hidden></aside>
    <div class="hoja-wrap">
      <main id="app" class="hoja" tabindex="-1">
        <p class="muted">Abriendo tu cuaderno…</p>
      </main>
      <nav class="separadores" id="separadores" aria-label="Separadores de cursos"></nav>
    </div>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- Build para navegador de highlight.js: incluye SQL, Python, YAML, Bash y Markdown.
       Los colores de la sintaxis vienen de cada tema (ver base.css). -->
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script src="assets/js/texto.js"></script>
  <script src="assets/js/progreso.js"></script>
  <script src="assets/js/cuaderno.js"></script>
  <script src="assets/js/tutor.js"></script>
  <script src="assets/js/resaltado.js"></script>
  <!-- Práctica: la consola SQL (sql.js, en assets/vendor/sqljs) se carga solo al abrirla -->
  <script src="assets/js/practica-datos.js"></script>
  <script src="assets/js/practica.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
