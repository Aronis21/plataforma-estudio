<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plataforma de Estudio</title>
  <meta name="description" content="Cursos de estudio autónomo con teoría, ejercicios y exámenes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" id="hljsClaro" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" id="hljsOscuro" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="assets/css/styles.css">
  <script>
    // Aplica tema y tamaño de letra guardados antes de pintar, para evitar parpadeos
    try {
      const pref = JSON.parse(localStorage.getItem("plataforma-estudio:preferencias")) || {};
      if (pref.tema) document.documentElement.dataset.theme = pref.tema;
      if (pref.letra) document.documentElement.dataset.letra = pref.letra;
    } catch (_) {}
  </script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn menu-btn" id="menuBtn" aria-label="Abrir índice" hidden>☰</button>
    <a href="#/" class="brand"><span class="brand-mark">◆</span> <span id="siteTitle">Plataforma de Estudio</span></a>
    <nav class="crumbs" id="crumbs" aria-label="Ruta"></nav>
    <div class="prefs">
      <button class="icon-btn" id="btnLetra" type="button" aria-label="Cambiar tamaño de letra" title="Tamaño de letra">Aa</button>
      <button class="icon-btn" id="btnTema" type="button" aria-label="Cambiar tema claro u oscuro" title="Tema claro u oscuro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
    </div>
  </header>
  <div class="layout" id="layout">
    <aside class="sidebar" id="sidebar" hidden></aside>
    <main id="app" class="main" tabindex="-1">
      <p class="muted">Cargando…</p>
    </main>
  </div>
  <div class="backdrop" id="backdrop" hidden></div>

  <!-- Build para navegador de highlight.js: incluye SQL, Python, YAML, Bash y Markdown -->
  <script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
  <script src="assets/js/texto.js"></script>
  <script src="assets/js/progreso.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
